---
title: 'Test notifications'
---

{{> navbar}}

<main class="main main--interior">
  <div class="container py-4">
    <div id="private-content" style="display: none;">
      <h1 class="h3 mb-3">Test notifications</h1>
      <p class="text-muted">
        Clears today’s achievement, resets the red badge, and runs the daily
        notification as if it were a new day.
      </p>
      <button type="button" class="btn btn-primary" id="test-notifications-btn">
        Test notifications
      </button>
      <button type="button" class="btn btn-outline-primary ml-2" id="enable-notifications-btn">
        Enable notifications
      </button>
      <p id="test-notifications-status" class="mt-3 mb-0" style="display: none;"></p>
    </div>

    <div id="login-required-message" style="display: none;">
      <h1 class="h3 mb-3">Test notifications</h1>
      <p>Log in to test the notification system.</p>
      <button class="btn btn-primary" onclick="handleLogin(); return false;">Log In</button>
    </div>
  </div>
</main>

<script src="/habits/auth_page_load.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('test-notifications-btn');
    const enableBtn = document.getElementById('enable-notifications-btn');
    const status = document.getElementById('test-notifications-status');
    if (!btn) return;

    if (enableBtn) {
      enableBtn.addEventListener('click', async () => {
        if (typeof window.enableNotifications !== 'function') {
          status.style.display = 'block';
          status.textContent = 'Notification script is not loaded. Refresh the page.';
          return;
        }
        enableBtn.disabled = true;
        status.style.display = 'block';
        status.textContent = 'Requesting notification permission…';
        try {
          await window.enableNotifications();
          status.textContent = 'Notifications enabled. You should see Habit Stacker under iPhone Settings → Notifications.';
        } catch (err) {
          status.textContent = err.message || 'Could not enable notifications.';
        } finally {
          enableBtn.disabled = false;
        }
      });
    }

    btn.addEventListener('click', async () => {
      if (typeof window.testNotifications !== 'function') {
        status.style.display = 'block';
        status.textContent = 'Notification script is not loaded. Refresh the page.';
        return;
      }
      btn.disabled = true;
      status.style.display = 'block';
      status.textContent = 'Resetting and sending a test notification…';
      try {
        const result = await window.testNotifications();
        status.textContent = result && result.message
          ? result.message
          : 'Done. Check the red 1 on Achievements and the hamburger.';
      } catch (err) {
        status.textContent = err.message || 'Test failed.';
      } finally {
        btn.disabled = false;
      }
    });
  });
</script>
